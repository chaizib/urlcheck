name: URL Check

on:
  schedule:
    - cron: '0 5 * * *'     # UTC 05:00 → 北京 13:00
    - cron: '0 20 * * *'    # UTC 20:00 → 北京 04:00 次日
  workflow_dispatch:

# 并发保护：防止多次排队，新任务直接覆盖旧任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Check and record
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}
          MAX_AGE_DAYS: 7
          IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: python .github/scripts/check_url.py

      - name: Commit and push if changed
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git pull --rebase origin main || true
          git add history/records.json README.md index.html
          git diff --staged --quiet || git commit -m "Update check records and index.html $(date '+%Y-%m-%d %H:%M:%S %Z')"
          git push origin main || git push
